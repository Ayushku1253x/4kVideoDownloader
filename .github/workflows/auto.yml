name: Auto Extract and Build
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  extract_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIP
        run: |
          unzip -q *.zip -d temp_code
          rm *.zip
          mv -v temp_code/* ./
          mv -v temp_code/.* ./ 2>/dev/null || true
          rm -rf temp_code
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          
      - name: Build APK
        run: |
          chmod +x ./gradlew || true
          gradle assembleDebug --no-daemon
          
      - name: Commit Code and Clean Repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-extracted source code"
          git push
          
      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 4K Downloader v1.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
